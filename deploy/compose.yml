services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: goldtrust
      POSTGRES_USER: goldtrust
      POSTGRES_PASSWORD: goldtrust_dev_secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goldtrust -d goldtrust"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../backend
      dockerfile: ../deploy/Dockerfile.api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://goldtrust:goldtrust_dev_secret@db:5432/goldtrust
      ENVIRONMENT: dev
      SECRET_KEY: dev_secret_key_change_in_production_32bytes
      BLOB_STORAGE_PATH: /data/blobs
    volumes:
      - ../data/blobs:/data/blobs
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  pgdata:
  caddy_data:
  caddy_config:
