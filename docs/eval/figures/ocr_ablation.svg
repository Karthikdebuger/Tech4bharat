<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" width="100%" height="100%">
  <rect width="700" height="320" rx="16" fill="#0f172a"/>
  <text x="32" y="44" font-family="-apple-system, sans-serif" font-size="18" font-weight="bold" fill="#f8fafc">
    Ablation Study: Bill OCR Field Extraction Accuracy Across Pipeline Stages
  </text>
  <text x="32" y="66" font-family="sans-serif" font-size="12" fill="#94a3b8">
    Evaluated on 50 Indian jewellery tax invoices (HUID, Purity, Weight)
  </text>

  <text x="32" y="114" font-family="sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">Raw Tesseract</text>
  <rect x="310" y="100" width="350" height="18" rx="4" fill="#334155"/>
  <rect x="310" y="100" width="164" height="18" rx="4" fill="#ef4444"/>
  <text x="479" y="114" font-family="monospace" font-size="11" font-weight="bold" fill="#f8fafc"> 47%</text>

  <text x="32" y="162" font-family="sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">+ Image Prep (Grayscale/Contrast)</text>
  <rect x="310" y="148" width="350" height="18" rx="4" fill="#334155"/>
  <rect x="310" y="148" width="245" height="18" rx="4" fill="#ef4444"/>
  <text x="560" y="162" font-family="monospace" font-size="11" font-weight="bold" fill="#f8fafc"> 70%</text>

  <text x="32" y="210" font-family="sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">+ Keyword Proximity Matching</text>
  <rect x="310" y="196" width="350" height="18" rx="4" fill="#334155"/>
  <rect x="310" y="196" width="304" height="18" rx="4" fill="#f59e0b"/>
  <text x="619" y="210" font-family="monospace" font-size="11" font-weight="bold" fill="#f8fafc"> 87%</text>

  <text x="32" y="258" font-family="sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">+ Human-in-the-Loop Confirmation</text>
  <rect x="310" y="244" width="350" height="18" rx="4" fill="#334155"/>
  <rect x="310" y="244" width="350" height="18" rx="4" fill="#10b981"/>
  <text x="665" y="258" font-family="monospace" font-size="11" font-weight="bold" fill="#f8fafc"> 100%</text>
</svg>